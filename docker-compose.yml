services:
  tgsolarmonitor:
    build: .
    container_name: tgsolarmonitor
    restart: "yes"
    # No host port any more - nginx below owns 40555 and proxies to this
    # container over tgappsnetwork.
    expose:
      - "40555"
    mem_limit: 512m
    # Cap docker's json log so it can't slowly fill the NAS disk
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tgappsnetwork

  tgsolarmonitor-nginx:
    image: nginx:alpine
    container_name: tgsolarmonitor-nginx
    restart: "yes"
    depends_on:
      - tgsolarmonitor
    ports:
      - "40555:80"
    volumes:
      # Project folder on the NAS, read-only. nginx serves index2.html,
      # css/, js/ and res/ straight from here (see nginx/default.conf),
      # so replacing those files needs no rebuild.
      - ./:/srv/tgsolar:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    # Cap docker's json log so it can't slowly fill the NAS disk
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - tgappsnetwork

networks:
  tgappsnetwork:
    external: true
