    <script>
        // Phones go to the mobile version (/mobile), before anything else loads.
        // A phone: a small screen, or a mobile browser ("Mobi" in the user agent; Android TV boxes don't have it).
        (function () {
            let isMobileBrowser = (navigator.userAgentData && navigator.userAgentData.mobile) || /Mobi/i.test(navigator.userAgent);
            if (isMobileBrowser || window.matchMedia("(max-width: 768px)").matches)
                location.replace("/mobile");
        })();
    </script>

    <script>

        //         Total payback days = 4.82 years × 365 days = 1,759.3 days
        // Daily savings = RM140,741 ÷ 1,759.3 days
        // Daily savings = RM80.00 per day


        const testLocalServer = false; // public = false  // @@@
        const onlineServer = true; // public = true 

        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        let url = "https://tgapps.synology.me:40556";

        if (onlineServer == true) {
            url = ""; // Local server URL
        }

        if (testLocalServer == true) {
            url = "http://127.0.0.1:40555"; // 
        }

        // Reload guard: ping the server first so we never throw away a working
        // page when the server / network is down. Retries a few times, then gives up.
        const serverTimeUrl = "https://tgapps.synology.me:40556/getServerTime";

        async function safeReload(attempt = 1) {
            const maxAttempts = 3;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);

                const response = await fetch(serverTimeUrl + "?t=" + Date.now(), {
                    cache: "no-store",
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (response.ok == false) {
                    throw new Error("getServerTime returned " + response.status);
                }

                location.reload();
            } catch (err) {
                console.log("safeReload: server not reachable, reload skipped (attempt " + attempt + " of " + maxAttempts + ") - " + err);

                if (attempt < maxAttempts) {
                    setTimeout(function () { safeReload(attempt + 1); }, 5000);
                }
            }
        }

        function isBlank(val) {
            if (val != undefined && String(val).trim().length != 0 && val != null && val != 'null')

        // Count a value element from what it shows now to `to`, then flash it green (up)
        // or red (down). The first value an element gets only counts up, no flash.
        // Non-numeric targets ("-") are written as-is.
        function animateNumber(el, to) {
            if (!el) return;

            const target = String(to);
            if (target === el.dataset.value) return; // unchanged, or already heading there

            const previous = parseFloat(el.dataset.value);
            el.dataset.value = target;

            if (el._countAnim) {
                cancelAnimationFrame(el._countAnim);
                el._countAnim = null;
            }

            const toNum = parseFloat(target);
            if (isNaN(toNum)) {
                el.textContent = target;
                return;
            }

            let from = parseFloat(el.textContent);
            if (isNaN(from)) from = 0;

            const decimals = (target.split('.')[1] || '').length;
            const duration = 1200;
            const start = performance.now();

            function step(now) {
                const t = Math.min((now - start) / duration, 1);
                const eased = 1 - Math.pow(1 - t, 3); // easeOutCubic
                el.textContent = (from + (toNum - from) * eased).toFixed(decimals);

                if (t < 1) {
                    el._countAnim = requestAnimationFrame(step);
                } else {
                    el.textContent = target;
                    el._countAnim = null;
                }
            }
            el._countAnim = requestAnimationFrame(step);

            if (isNaN(previous) == false) {
                el.classList.remove('value-flash-up', 'value-flash-down');
                void el.offsetWidth; // force reflow so the flash restarts
                el.classList.add(toNum > previous ? 'value-flash-up' : 'value-flash-down');
            }
        }

        // One refresh can write the same value element several times (server value first,
        // then a recalculated one). Stage the writes and animate once at the end, so the
        // count-up never runs through those in-between values.
        function setPendingValue(el, value) {
            if (el) el.dataset.pending = value;
        }

        function commitPendingValues(root) {
            (root || document).querySelectorAll('[data-pending]').forEach(el => {
                const value = el.dataset.pending;
                delete el.dataset.pending;
                animateNumber(el, value);
            });
        }

                            log("Fetch Data All: page " + (pageIndex + 1) + " | " + obj.username + " | " + totalToday + " | " + totalThisMonth + " | " + totalLastMonth);

                        animateNumber(getPageElement("divTodayTotal_Today", pageIndex), Math.round(totalToday));
                        animateNumber(getPageElement("divTodayThisMonth_Today", pageIndex), Math.round(totalThisMonth));
                        animateNumber(getPageElement("divTodayLastMonth_Today", pageIndex), Math.round(totalLastMonth));
                        animateNumber(getPageElement("divTotal_Yesterday", pageIndex), Math.round(totalYesterday));

                        // Ratio of 1st account vs 2nd account (today's kWh production), only for a page of 2 accounts.
                        // kWh, not revenue: the history Min/Max is pv x the same rate for both accounts (= a kWh ratio),
                        // while today's revenue is the portal's for account 1 but pv x 0.37 for account 2
                        if (accounts.length == 2) {
                            let account1PV = await getTodayProductionKWh(accounts[0].username);
                            let account2PV = await getTodayProductionKWh(accounts[1].username);

                            let ratio = account2PV > 0 ? (account1PV / account2PV) : null;
                            log("Account ratio - " + accounts[0].username + ": " + account1PV + " kWh | " + accounts[1].username + ": " + account2PV + " kWh | Ratio: " + (ratio != null ? ratio.toFixed(2) : "-"));

                            pageRatios[pageIndex].pv1 = account1PV;
                            pageRatios[pageIndex].pv2 = account2PV;
                            renderPageRatio(pageIndex);
                        }
                    }

                finally {
                    // check the last update time of all accounts (once each, even if on several pages)
                    let checkedUsernames = new Set();
                    for (const obj of pagesToFetch.flat()) {
                        if (checkedUsernames.has(obj.username))
                            continue;
                        checkedUsernames.add(obj.username);

                        let lastUpdateTime = await getLastUpdateTime(obj.username);
                        let isStale = false;

                        if (lastUpdateTime !== null) {
                            //compare to current time
                            let currentTime = new Date();
                            let diff = currentTime - lastUpdateTime;
                            let diffInMinutes = diff / 60000;
                            log("diffInMinutes: " + diffInMinutes + " | " + obj.username);

                            // if more than 15 minutes, highlight this account
                            isStale = diffInMinutes > 15;

                        // set red / transparent once per refresh (no reset at the start),
                        // so a stale panel stays red instead of blinking off during the refresh
                        document.querySelectorAll(`.net-revenue.net-revenue-today[data-username="${obj.username}"]`).forEach(el => el.style.backgroundColor = isStale ? "#db0000" : "transparent");
                    }


                    resolve("");
                }


            });

        ///////// Pages (slides) /////////
        // TGSolar_pages holds each page's usernames and how long it stays up, e.g.
        // [{ "accounts": ["a@x.com","b@x.com"], "seconds": 30 }, { "accounts": ["a@x.com"], "seconds": 10 }].
        // (The first version saved plain arrays of usernames; those still load, with the default seconds.)
        // Each page is one slide with its own top totals, account columns and footer.
        // An account can be on more than one page (see getSlotKey).

        const defaultSlideSeconds = 20;  // how long a page stays up when not set
        const slideSecondsOptions = [5, 10, 15, 20, 30, 45, 60, 90, 120, 180, 300]; // choices in Page Settings
        const slidePauseSeconds = 60;    // after a manual move, wait longer before auto sliding again

        let pages = [];                       // array of pages, each an array of account objects
        let pageSeconds = [];                 // per page: seconds it stays up before sliding on
        let accountColorHM = new Map();       // username -> border colour, same on every page
        let pageRatios = [];                  // per page { min, max, live, pv1, pv2 } (pages with 2 accounts)
        let currentPage = 0;
        let nextSlideAt = 0;
        let slideTimerId = null;

        function sortAccountsByUsername(accounts) {
            return accounts.sort((a, b) => a.username.localeCompare(b.username));
        }

        function formatSeconds(seconds) {
            if (seconds >= 60 && seconds % 60 == 0)
                return (seconds / 60) + ' min';
            return seconds + 's';
        }

        // Saved pages as [{ accounts, seconds }], checked against the server's accounts. Unknown accounts
        // are dropped, an account is only kept once per page, and empty pages are removed.
        // Nothing saved yet -> one page with the accounts selected before pages existed.
        function getSavedPages() {
            let accountsByName = new Map(available_accounts.map(user => [user.username, user]));
            let result = [];

            let saved = null;
            try {
                saved = JSON.parse(localStorage.getItem('TGSolar_pages'));
            } catch (err) {
                saved = null;
            }

            if (Array.isArray(saved)) {
                saved.forEach(savedPage => {
                    // old format: a plain array of usernames
                    let usernames = Array.isArray(savedPage) ? savedPage : (savedPage && Array.isArray(savedPage.accounts) ? savedPage.accounts : null);
                    if (usernames == null)
                        return;

                    let seconds = parseInt(savedPage.seconds);
                    if (isNaN(seconds) || seconds < 1)
                        seconds = defaultSlideSeconds;

                    let pageAccounts = [];
                    let used = new Set();
                    usernames.forEach(username => {
                        if (accountsByName.has(username) && used.has(username) == false) {
                            used.add(username);
                            pageAccounts.push(accountsByName.get(username));
                        }
                    });

                    if (pageAccounts.length != 0)
                        result.push({ accounts: sortAccountsByUsername(pageAccounts), seconds: seconds });
                });
            }

            if (result.length == 0) {
                let pageAccounts = JSON.parse(getSavedAccounts())
                    .filter(user => accountsByName.has(user.username))
                    .map(user => accountsByName.get(user.username));

                if (pageAccounts.length == 0 && available_accounts.length != 0)
                    pageAccounts.push(available_accounts[0]);

                if (pageAccounts.length != 0)
                    result.push({ accounts: sortAccountsByUsername(pageAccounts), seconds: defaultSlideSeconds });
            }

            return result;
        }

        // pagesToSave: [{ accounts: [account objects], seconds }]
        function savePages(pagesToSave) {
            localStorage.setItem('TGSolar_pages', JSON.stringify(pagesToSave.map(page => ({
                accounts: page.accounts.map(user => user.username),
                seconds: page.seconds
            }))));

            // keep the shared selection (used by the other dashboards) in step: every account on any page, once
            selectedUsers = [...new Map(pagesToSave.flatMap(page => page.accounts).map(user => [user.username, user])).values()];
            saveAccounts();
        }

        // page elements share a base id, with the page index at the end: divTodayTotal_Today_p0
        function getPageElement(baseId, pageIndex) {
            return document.getElementById(baseId + "_p" + pageIndex);
        }

        // account's location (accounts.location, loaded into usernamesHM), "" if not set
        function getAccountLocation(username) {
            let info = usernamesHM.get(username);
            return info && info.location ? String(info.location).trim() : "";
        }

        // locations of the accounts on a page, each shown once (same location -> only one), blanks skipped
        function getPageLocations(pageAccounts) {
            let locations = new Map(); // lowercase -> as written
            pageAccounts.forEach(user => {
                let location = getAccountLocation(user.username);
                if (location != "" && !locations.has(location.toLowerCase()))
                    locations.set(location.toLowerCase(), location);
            });
            return [...locations.values()];
        }

        // Page settings: a grid of checkboxes, one row per account, one column per page.
        // An account can be ticked on several pages. Each column has a ✕ to remove the page and a
        // "Show for" dropdown (how long the page stays up). Reloads when something changed.
        function openPageSettingsDialog() {
            const content = document.createElement('div');
            content.className = 'pageSettings';

            const title = document.createElement('h2');
            title.textContent = 'Page Settings';
            content.appendChild(title);

            const table = document.createElement('table');
            const headerRow = document.createElement('tr');
            headerRow.appendChild(document.createElement('th'));
            table.appendChild(headerRow);

            const rows = new Map(); // username -> <tr>
            available_accounts.forEach(user => {
                const row = document.createElement('tr');
                const name = document.createElement('td');
                name.className = 'pageSettingsName';
                name.textContent = user.username;
                let location = getAccountLocation(user.username);
                if (location != "") {
                    const locationLine = document.createElement('div');
                    locationLine.className = 'pageSettingsLocation';
                    locationLine.textContent = '📍 ' + location;
                    name.appendChild(locationLine);
                }
                row.appendChild(name);
                table.appendChild(row);
                rows.set(user.username, row);
            });

            const secondsRow = document.createElement('tr');
            secondsRow.className = 'pageSettingsSecondsRow';
            const secondsLabel = document.createElement('td');
            secondsLabel.className = 'pageSettingsName';
            secondsLabel.textContent = 'Show for';
            secondsRow.appendChild(secondsLabel);
            table.appendChild(secondsRow);

            // one entry per column, in order: { header, label, cells: [<td>], checkboxes: Map(username -> checkbox), secondsSelect }
            let columns = [];

            function renumberColumns() {
                columns.forEach((column, i) => column.label.textContent = 'Page ' + (i + 1));
            }

            function addPageColumn(pageAccounts, seconds) {
                let column = { cells: [], checkboxes: new Map() };

                column.header = document.createElement('th');
                column.label = document.createElement('span');
                column.header.appendChild(column.label);

                const removeButton = document.createElement('button');
                removeButton.className = 'pageSettingsRemove';
                removeButton.textContent = '✕';
                removeButton.title = 'Remove this page';
                removeButton.onclick = function () {
                    column.header.remove();
                    column.cells.forEach(cell => cell.remove());
                    columns = columns.filter(c => c !== column);
                    renumberColumns();
                };
                column.header.appendChild(removeButton);
                headerRow.appendChild(column.header);

                rows.forEach((row, username) => {
                    const cell = document.createElement('td');
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = pageAccounts.some(u => u.username == username);
                    cell.appendChild(checkbox);
                    row.appendChild(cell);
                    column.cells.push(cell);
                    column.checkboxes.set(username, checkbox);
                });

                const secondsCell = document.createElement('td');
                column.secondsSelect = document.createElement('select');
                let options = slideSecondsOptions.includes(seconds) ? slideSecondsOptions : [...slideSecondsOptions, seconds].sort((a, b) => a - b);
                options.forEach(value => {
                    const option = document.createElement('option');
                    option.value = value;
                    option.textContent = formatSeconds(value);
                    column.secondsSelect.appendChild(option);
                });
                column.secondsSelect.value = seconds;
                secondsCell.appendChild(column.secondsSelect);
                secondsRow.appendChild(secondsCell);
                column.cells.push(secondsCell);

                columns.push(column);
                renumberColumns();
            }

            // the current pages, plus one empty page to add to
            pages.forEach((pageAccounts, i) => addPageColumn(pageAccounts, pageSeconds[i] || defaultSlideSeconds));
            addPageColumn([], defaultSlideSeconds);

            content.appendChild(table);

            // page glow strength: applied as soon as it's changed, and saved
            const glowRow = document.createElement('div');
            glowRow.className = 'pageSettingsGlow';
            const glowLabel = document.createElement('span');
            glowLabel.textContent = 'Page glow';
            glowRow.appendChild(glowLabel);

            const glowSelect = document.createElement('select');
            let currentGlow = getPageGlow();
            let glowOptions = pageGlowOptions.includes(currentGlow) ? pageGlowOptions : [...pageGlowOptions, currentGlow].sort((a, b) => a - b);
            glowOptions.forEach(value => {
                const option = document.createElement('option');
                option.value = value;
                option.textContent = value == 0 ? 'Off' : Math.round(value * 100) + '%';
                glowSelect.appendChild(option);
            });
            glowSelect.value = currentGlow;
            glowSelect.onchange = function () {
                savePageGlow(parseFloat(glowSelect.value));
                applyPageGlow();
            };
            glowRow.appendChild(glowSelect);
            content.appendChild(glowRow);

            const note = document.createElement('div');
            note.className = 'pageSettingsNote';
            note.textContent = 'Ticked accounts on the same page are shown side by side. An account can be on more than one page. ✕ removes a page; a page with nothing ticked is skipped too. "Show for" is how long the page stays up before sliding to the next. "Page glow" is how strong each page\'s colour shows at the top (only with 2+ pages).';
            content.appendChild(note);

            const buttons = document.createElement('div');
            buttons.className = 'pageSettingsButtons';

            const addButton = document.createElement('button');
            addButton.className = 'pageSettingsButton pageSettingsButtonSecondary';
            addButton.textContent = '+ Add Page';
            addButton.onclick = function () {
                addPageColumn([], defaultSlideSeconds);
            };
            buttons.appendChild(addButton);

            const doneButton = document.createElement('button');
            doneButton.className = 'pageSettingsButton';
            doneButton.textContent = 'Done';
            buttons.appendChild(doneButton);

            content.appendChild(buttons);

            const dialog = new SimpleDialog(content, {
                onClose: function () {
                    let newPages = [];

                    // columns in order; empty ones just disappear
                    columns.forEach(column => {
                        let pageAccounts = available_accounts.filter(u => column.checkboxes.get(u.username).checked);

                        if (pageAccounts.length != 0)
                            newPages.push({ accounts: sortAccountsByUsername(pageAccounts), seconds: parseInt(column.secondsSelect.value) });
                    });

                    // nothing selected -> default to the first account
                    if (newPages.length == 0 && available_accounts.length != 0)
                        newPages.push({ accounts: [available_accounts[0]], seconds: defaultSlideSeconds });

                    let oldValue = JSON.stringify(pages.map((p, i) => [p.map(u => u.username), pageSeconds[i]]));
                    let newValue = JSON.stringify(newPages.map(p => [p.accounts.map(u => u.username), p.seconds]));
                    if (oldValue == newValue)
                        return;

                    savePages(newPages);

                    stopRefetchInterval();
                    stopSlideTimer();
                    showProgressDialog();

                    safeReload();
                }
            });

            doneButton.onclick = function () {
                dialog.close();
            };

            dialog.show();
        }

        // Page 1 keeps the first colour from brightColors; the other pages take these in turn
        // (picked to stand apart from the account colours, which come from brightColors).
        const pageColors = [
            "#2979FF", // blue
            "#FF4081", // pink
            "#B388FF", // lavender
            "#FFC400", // amber
            "#00BFA5", // teal
            "#FF5252", // coral red
            "#E0E0E0"  // silver
        ];

        function getPageColor(pageIndex, firstColor) {
            if (pageIndex == 0)
                return firstColor;
            return pageColors[(pageIndex - 1) % pageColors.length];
        }

        // Page glow: alpha of the page colour at the top of each page, set in Page Settings,
        // saved in localStorage.TGSolar_pageGlow (0 = off)
        const defaultPageGlow = 0.50;
        const pageGlowOptions = [0, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 1];
        let pageColorList = []; // per page: its colour (set in buildPages)

        function getPageGlow() {
            let value = NaN;
            try {
                value = parseFloat(localStorage.getItem('TGSolar_pageGlow'));
            } catch (err) {
                value = NaN;
            }
            if (isNaN(value) || value < 0 || value > 1)
                return defaultPageGlow;
            return value;
        }

        function savePageGlow(value) {
            try {
                localStorage.setItem('TGSolar_pageGlow', value);
            } catch (err) {
                // private mode etc, it just won't be remembered
            }
        }

        // only with 2+ pages, a single page looks the same as before
        function applyPageGlow() {
            let glow = getPageGlow();
            pageColorList.forEach((color, pageIndex) => {
                let page = document.getElementById("page_" + pageIndex);
                if (!page)
                    return;
                if (pages.length > 1 && glow > 0)
                    page.style.setProperty('--page-glow', hexToRgba(color, glow));
                else
                    page.style.removeProperty('--page-glow');
            });
        }

        // "#2979FF" -> "rgba(41,121,255,0.15)" (for the page glow)
        function hexToRgba(hex, alpha) {
            hex = hex.replace('#', '');
            if (hex.length === 3)
                hex = hex.split('').map(x => x + x).join('');
            let r = parseInt(hex.substring(0, 2), 16);
            let g = parseInt(hex.substring(2, 4), 16);
            let b = parseInt(hex.substring(4, 6), 16);
            return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
        }

        // Builds one slide per page: top totals, the row the account columns go into, and the footer.
        function buildPages() {
            let firstPageColor = getColorRemaining(); // page 1's colour (taken first, so the account colours stay as before)

            // give each account its colour now (page order, same as refetchData would),
            // so the page titles can show the names in the colours of their columns
            pages.flat().forEach(user => {
                if (accountColorHM.has(user.username) == false)
                    accountColorHM.set(user.username, getColorRemaining());
            });

            const slider = document.createElement('div');
            slider.id = "slider";

            const track = document.createElement('div');
            track.id = "sliderTrack";

            pages.forEach((pageAccounts, pageIndex) => {
                pageRatios[pageIndex] = { min: "", max: "", live: "" };

                const page = document.createElement('div');
                page.className = "page";
                page.id = "page_" + pageIndex;

                // each page has its own colour: top border, page dot and a faint glow, so you can tell pages apart
                let pageColor = getPageColor(pageIndex, firstPageColor);
                pageColorList[pageIndex] = pageColor;

                page.appendChild(createTopContainer(pageIndex, pageColor));

                const containerMain = document.createElement('div');
                containerMain.className = "containerMain";
                containerMain.id = "containerMain_" + pageIndex;
                page.appendChild(containerMain);

                page.appendChild(createPageFooter(pageIndex, pageAccounts));

                track.appendChild(page);
            });

            slider.appendChild(track);
            document.body.appendChild(slider);

            applyPageGlow();

            if (pages.length > 1) {
                const dots = document.createElement('div');
                dots.id = "pageDots";

                pages.forEach((pageAccounts, pageIndex) => {
                    const dot = document.createElement('div');
                    dot.className = "pageDot";
                    dot.style.setProperty('--page-color', pageColorList[pageIndex]);
                    dot.title = "Page " + (pageIndex + 1) + " (" + formatSeconds(getPageSeconds(pageIndex)) + "): " + pageAccounts.map(u => u.username.split("@")[0]).join(", ");
                    dot.onclick = function () {
                        manualGoToPage(pageIndex);
                    };
                    dots.appendChild(dot);
                });

                document.body.appendChild(dots);

                document.addEventListener('keydown', function (e) {
                    if (document.querySelector('.simple-dialog-overlay'))
                        return; // a dialog is open

                    if (e.key === 'ArrowRight')
                        manualGoToPage(currentPage + 1);
                    else if (e.key === 'ArrowLeft')
                        manualGoToPage(currentPage - 1);
                });

                // swipe on touch screens
                let touchStartX = null;
                slider.addEventListener('touchstart', function (e) {
                    touchStartX = e.touches[0].clientX;
                }, { passive: true });
                slider.addEventListener('touchend', function (e) {
                    if (touchStartX === null)
                        return;
                    let dx = e.changedTouches[0].clientX - touchStartX;
                    touchStartX = null;
                    if (Math.abs(dx) > 50)
                        manualGoToPage(currentPage + (dx < 0 ? 1 : -1));
                });
            }

            // stay on the same page across the hourly reload
            let savedPage = 0;
            try {
                savedPage = parseInt(sessionStorage.getItem('TGSolar_index4_page')) || 0;
            } catch (err) {
                savedPage = 0;
            }
            goToPage(Math.min(savedPage, pages.length - 1), false);
        }

        // Footer: Max PV under each account. A page of exactly 2 accounts also gets the ratio in between.
        function createPageFooter(pageIndex, pageAccounts) {
            const footer = document.createElement('div');
            footer.className = "pageFooter";
            footer.id = "bottomFooterContainer_p" + pageIndex;

            pageAccounts.forEach((user, i) => {
                if (i == 1 && pageAccounts.length == 2) {
                    const ratioElement = document.createElement('div');
                    ratioElement.className = "accountRatio";
                    ratioElement.id = "accountRatio_p" + pageIndex;
                    footer.appendChild(ratioElement);
                }

                // Max PV (getHistoryMaxPVData) + a tiny today's production beside it (refetchDataAll)
                const maxPV = document.createElement('div');
                maxPV.className = "maxPV";
                maxPV.id = "maxPV_" + getSlotKey(user.username, pageIndex);
                maxPV.dataset.username = user.username;
                maxPV.innerHTML = `<span class="maxPVValue"></span><span class="todayPV" id="todayPV_${getSlotKey(user.username, pageIndex)}"></span><div class="maxPVHint"></div>`;
                footer.appendChild(maxPV);
            });

            return footer;
        }

        function renderPageRatio(pageIndex) {
            let ratioElement = getPageElement("accountRatio", pageIndex);
            if (!ratioElement)
                return;

            let ratio = pageRatios[pageIndex];
            ratioElement.innerHTML = `
    <span class="val-min">(Min) ${ratio.min}</span>
    <span class="val-curr">(Live) ${ratio.live}</span>
    <span class="val-max">(Max) ${ratio.max}</span>
    <div class="ratioHint">${getPageRatioHint(pageIndex)}</div>
`;
        }

        // mouse over hint of the ratio: what it is, today's numbers, and which panels may need washing
        function getPageRatioHint(pageIndex) {
            let ratio = pageRatios[pageIndex];
            let name1 = pages[pageIndex][0].username.split("@")[0];
            let name2 = pages[pageIndex][1].username.split("@")[0];

            let live = parseFloat(ratio.live);
            let min = parseFloat(ratio.min);
            let max = parseFloat(ratio.max);

            let status = "Waiting for data";
            if (isNaN(live) == false && isNaN(min) == false && isNaN(max) == false) {
                if (live < min)
                    status = `<span class="val-min">Below Min</span>: <b>${name1}</b> is producing less than usual, its panels may need washing`;
                else if (live > max)
                    status = `<span class="val-max">Above Max</span>: <b>${name2}</b> is producing less than usual, its panels may need washing`;
                else
                    status = `<span class="val-curr">Within range</span>: both are producing normally`;
            }

            let pvText = ratio.pv1 != null
                ? `${ratio.pv1.toFixed(1)} kWh ÷ ${ratio.pv2.toFixed(1)} kWh`
                : "-";

            return `
        <b>Production ratio: ${name1} ÷ ${name2}</b><br>
        <span class="val-curr">Live</span>: today's kWh so far = ${pvText}<br>
        <span class="val-min">Min</span> / <span class="val-max">Max</span>: lowest / highest daily ratio over the last 3 completed months<br>
        <br>
        Live outside Min - Max means one site's panels may be dirty:<br>
        &bull; below Min: wash <b>${name1}</b><br>
        &bull; above Max: wash <b>${name2}</b><br>
        <br>
        Now: ${status}<br>
        <span class="ratioHintNote">Best read in the late afternoon, morning values swing a lot. Rule out an inverter fault or a stale scrape first.</span>

        function aggregateHourly(data) {
            const hourly = {};

            data.forEach(entry => {
                const hour = getHour(entry.time);

                if (!hourly[hour]) {
                    // Initialize sums and last cumulativeRM
                    hourly[hour] = {
                        time: hour,
                        pv: 0,
                        grid: 0,
                        load: 0,
                        energyKWh: 0,
                        savingsRM: 0,
                        cumulativeRM: entry.cumulativeRM // will be overwritten by last in hour
                    };
                }

                hourly[hour].pv += entry.pv;
                hourly[hour].grid += entry.grid;
                hourly[hour].load += entry.load;
                hourly[hour].energyKWh += entry.energyKWh;
                hourly[hour].savingsRM += entry.savingsRM;
                hourly[hour].cumulativeRM = entry.cumulativeRM; // last value in hour
            });

            // Convert object to array
            return Object.values(hourly);
        }


        function aggregateHourlyNew(data) {
            // 1. Sort data by time just in case
            data = [...data].sort((a, b) => a.time.localeCompare(b.time));

            // 2. Find the range of times
            let times = data.map(entry => entry.time);

            // Helper to convert "HH:MM" to minutes
            function toMinutes(str) {
                let [h, m] = str.split(':').map(Number);
                return h * 60 + m;
            }

            // Find the first data time and create binning schedule
            let startTime = data[0].time;
            let currHour = Number(startTime.slice(0, 2));
            // Edge case: if the very first is exactly on the HH:00, skip that hour
            if (startTime.endsWith(":00")) {
                currHour++;
            } else {
                currHour++;
            }
            let currMinute = 0;

            // Get the final full hour for the data
            let lastDataMin = toMinutes(data[data.length - 1].time);
            let endHour = Number(data[data.length - 1].time.slice(0, 2));
            if (Number(data[data.length - 1].time.slice(3, 5)) > 0) endHour++;

            let results = [];

            while (currHour <= endHour) {
                // Define bin boundaries
                let binStart = toMinutes(String(currHour - 1).padStart(2, '0') + ":01");
                let binEnd = toMinutes(String(currHour).padStart(2, '0') + ":00");

                // Filter entries in this bin
                let binEntries = data.filter(entry => {
                    let min = toMinutes(entry.time);
                    return min >= binStart && min <= binEnd;
                });

                if (binEntries.length > 0) {
                    let agg = {
                        time: String(currHour).padStart(2, '0') + ':00',
                        pv: 0,
                        grid: 0,
                        load: 0,
                        energyKWh: 0,
                        savingsRM: 0,
                        cumulativeRM: binEntries[binEntries.length - 1].cumulativeRM
                    };
                    for (let entry of binEntries) {
                        agg.pv += entry.pv;
                        agg.grid += entry.grid;
                        agg.load += entry.load;
                        agg.energyKWh += entry.energyKWh;
                        agg.savingsRM += entry.savingsRM;
                    }
                    results.push(agg);
                }
                currHour++;
            }
            return results;
        }

        function aggregateByIntervalV2(data, binSizeMinutes = 60) {
            // Sort data by time
            data = [...data].sort((a, b) => a.time.localeCompare(b.time));
            if (data.length === 0) return [];

            // Helpers
            function toMinutes(str) {
                let [h, m] = str.split(':').map(Number);
                return h * 60 + m;
            }
            function fromMinutes(min) {
                let h = Math.floor(min / 60);
                let m = min % 60;
                return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
            }

            // Start from first time in data
            let firstMin = toMinutes(data[0].time);

            // Find the first bin end (the first "00", "30", etc. strictly after the first data point)
            let binEnd = Math.ceil(firstMin / binSizeMinutes) * binSizeMinutes;
            // (Edge-case: If start is exactly on bin boundary (":00", ":30"), should skip that? Original does.)

            if (firstMin % binSizeMinutes === 0) {
                binEnd += binSizeMinutes;
            }

            // Define bins: Each bin is (previous_bin_end - binSizeMinutes + 1) ... (binEnd) inclusive
            let results = [];
            let lastCumRM = 0;
            while (binEnd <= toMinutes(data[data.length - 1].time) + binSizeMinutes) {
                let binStart = binEnd - binSizeMinutes + 1;
                // "00:01" to "01:00", "01:01" to "02:00", etc

                // Filter entries in this bin (inclusive boundaries)
                let binEntries = data.filter(entry => {
                    let min = toMinutes(entry.time);
                    return min >= binStart && min <= binEnd;
                });

                if (binEntries.length > 0) {
                    let agg = {
                        time: fromMinutes(binEnd),    // Use the bin END as the label as original (e.g. "09:00")
                        pv: 0,
                        grid: 0,
                        load: 0,
                        energyKWh: 0,
                        savingsRM: 0,
                        cumulativeRM: binEntries[binEntries.length - 1].cumulativeRM
                    };
                    for (let entry of binEntries) {
                        agg.pv += entry.pv;
                        agg.grid += entry.grid;
                        agg.load += entry.load;
                        agg.energyKWh += entry.energyKWh;
                        agg.savingsRM += entry.savingsRM;
                    }

                    // Average the power values (W) over the interval
                    if (binEntries.length > 0) {
                        agg.pv /= binEntries.length;
                        agg.grid /= binEntries.length;
                        agg.load /= binEntries.length;
                    }

                    results.push(agg);
                }
                binEnd += binSizeMinutes;
            }

            return results;
        }


        function recalculateSavings(data, tariffRate = 0.37) {
            let dataReturn = [];

            let cumulative = 0;
            const intervalHours = 5 / 60; // 5 minutes in hours

            dataReturn = data.map((item, idx) => {
                // Calculate PV energy for this interval (kWh)
                const energyKWh = item.pv * intervalHours / 1000;
                // Calculate savings for this interval
                const savingsRM = energyKWh * tariffRate;
                // Update cumulative
                cumulative = cumulative + savingsRM;

                return {
                    ...item,
                    energyKWh: +energyKWh, // update energyKWh
                    savingsRM,
                    cumulativeRM: cumulative,
                };
            });

            return dataReturn;
        }



        function calculateCumulativeRM_Daily(data, ratePerKWh = 0.37, intervalMinutes = 5) {
            let cumulativeRM = 0;
            const results = [];

            data.forEach((entry, index) => {

                const pvW = entry.pv ?? 0;
                const grid = entry.grid ?? 0;
                const load = entry.load ?? 0;

                const energyKWh = (pvW / 1000) * (intervalMinutes / 60); // Convert to kWh
                const savingsRM = energyKWh * ratePerKWh;

                // Round to nearest sen (0.01)
                const roundedRM = Math.round(savingsRM * 100) / 100;

                // Only add real RM value (0.01 and above)
                cumulativeRM += roundedRM;

                results.push({
                    time: entry.time,
                    pv: entry.pv || 0,
                    grid: entry.grid || 0,
                    load: entry.load || 0,
                    energyKWh: energyKWh || 0,
                    savingsRM: roundedRM || 0,
                    cumulativeRM: cumulativeRM || 0
                });
            });

            return results;
        }

        function compareTimes(t1, t2) {
            const [h1, m1] = t1.split(':').map(Number);
            const [h2, m2] = t2.split(':').map(Number);
            if (h1 > h2 || (h1 === h2 && m1 > m2)) return 1;    // t1 is after t2
            if (h1 < h2 || (h1 === h2 && m1 < m2)) return -1;   // t1 is before t2
            return 0;                                           // equal
        }

        function hexToHSL(hex) {
            // Remove #
            hex = hex.replace('#', '');
            // Convert 3-digit to 6-digit
            if (hex.length === 3) {
                hex = hex.split('').map(x => x + x).join('');
            }
            let r = parseInt(hex.substring(0, 2), 16);
            let g = parseInt(hex.substring(2, 4), 16);
            let b = parseInt(hex.substring(4, 6), 16);

            r /= 255; g /= 255; b /= 255;

            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;

            if (max == min) {
                h = s = 0; // achromatic
            } else {
                let d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return {
                h: Math.round(h * 360),
                s: Math.round(s * 100),
                l: Math.round(l * 100)
            };
        }

        function makeGradientFromMainColor(mainHex) {
            const hsl = hexToHSL(mainHex);
            // Generate lighter and darker shades, e.g. L-25, L, L+20
            let light1 = `hsl(${hsl.h},${hsl.s}%,${Math.min(hsl.l + 20, 95)}%)`;
            let base = `hsl(${hsl.h},${hsl.s}%,${hsl.l}%)`;
            let dark1 = `hsl(${hsl.h},${hsl.s}%,${Math.max(hsl.l - 25, 15)}%)`;
            // Symmetrical for looping:
            return [dark1, base, light1, base, dark1].join(', ');
        }

        let countdown = gapToRefetch;
        let countdownId = null;  // manages the countdown interval
        let refreshCount = 0;

        async function startRefetchInterval() {
            // Optionally clear an old interval

            // one-time fetch highest revenue, per page
            pages.forEach((pageAccounts, pageIndex) => loadHighestRevenue(pageIndex));

            if (pages.length != 0) {
                await refetchDataAll(pages);
            }



            if (countdownId) clearInterval(countdownId);

            countdown = gapToRefetch;
            updateCountdownDisplay();

            countdownId = setInterval(async () => {
                countdown--;
                updateCountdownDisplay();

                if (countdown <= 0) {
                    countdown = gapToRefetch + 1; // reset countdown

                    if (pages.length != 0) {
                        refreshCount = refreshCount + 1;

                        if (refreshCount % 30 == 0) // every 30 minutes, refetch all data
                        {
                            try {
                                // race against a timeout: getUsernameInfo() can hang forever
                                // if its fetch throws inside the async promise executor
                                await Promise.race([

                                ]);

                            } finally {

                            }
                        }
                        else {
                            await refetchDataAll(pages);
                        }
                    }


                    updateCountdownDisplay();
                }
            }, 1000);
        }

            if (countdownId) {
