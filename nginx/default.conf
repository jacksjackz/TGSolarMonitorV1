# nginx front for tgsolarmonitor.
# - index2 page + its static assets are served directly from the host folder
#   (bind-mounted read-only at /srv/tgsolar), so replacing index2.html on the
#   NAS takes effect immediately - no docker rebuild / restart needed.
# - Everything else (API routes, other pages) is proxied to the node container.

server {
    listen 80;
    server_name _;

    # Docker's internal DNS - resolve the node container lazily so nginx
    # still starts if node is down, and follows it if its IP changes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $node_upstream http://tgsolarmonitor:40555;

    client_max_body_size 20m;   # matches express.json limit in app.js

    root /srv/tgsolar;

    # index2 / index4 pages (with or without .html) - always revalidate so a
    # replaced file is picked up on reload
    location ~ ^/(index2|index4)(\.html)?$ {
        default_type text/html;
        add_header Cache-Control "no-cache";
        try_files /$1.html =404;
    }

    # Static assets used by index2 / index4
    location ^~ /css/ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location ^~ /js/  { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location ^~ /res/ { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Never expose credentials, even by accident
    location ^~ /protected/ { return 403; }

    # Everything else -> node (API, /index, /index3, /admin, ...)
    location / {
        proxy_pass $node_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
